<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerQuest - Student Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #F5F0DF;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            text-align: center;
            color: #24452F;
        }

        .subtitle {
            text-align: center;
            color: #795438;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #24452F;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #24452F;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #80864B;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #795438;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CareerQuest</h1>

    <p class="subtitle">
        Your Career. Your Journey. Your Quest.
    </p>

    <h2>Student Login</h2>

    <form id="loginForm">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Sign Up</a>
    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerQuest - Mock Interviews</title>

<style>
body {
    background:#F5F0DF;
    color:#24452F;
    font-family:Arial,sans-serif;
    padding:20px;
}
.container {
    max-width:750px;
    margin:25px auto;
    background:white;
    padding:30px;
    border-radius:15px;
}
select, textarea {
    width:100%;
    padding:12px;
    margin:12px 0;
    box-sizing:border-box;
}
textarea {height:150px;}
button {
    background:#24452F;
    color:white;
    padding:13px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    margin:8px 0;
}
button:hover {background:#80864B;}
a {color:#795438;}
#feedback {font-weight:bold;}
</style>
</head>

<body>

<div class="container">

<h1>CareerQuest 🎤</h1>
<h2>Mock Interview Practice</h2>

<p>Prepare yourself for HR and technical interviews.</p>

<label>Select Interview Type</label>

<select id="type" onchange="changeCategory()">
<option value="hr">HR Interview</option>
<option value="technical">Technical Interview</option>
</select>

<h3 id="progress"></h3>

<h3 id="question"></h3>

<textarea id="answer"
placeholder="Write your interview answer here..."></textarea>

<br>

<button onclick="submitAnswer()">Submit Answer</button>

<p id="feedback"></p>

<button onclick="nextQuestion()">Next Question →</button>

<h3 id="completed"></h3>

<a href="dashboard.html">← Back to Dashboard</a>

</div>

<script>

const questions = {

hr: [
"Tell me about yourself.",
"What are your greatest strengths?",
"What is one weakness you are working to improve?",
"Why should we hire you?",
"Why do you want to join our company?",
"Where do you see yourself in five years?",
"How do you handle pressure?",
"Describe a challenge you successfully overcame.",
"Are you comfortable working in a team?",
"What are your career goals?"
],

technical: [
"What is object-oriented programming?",
"Explain the four pillars of OOP.",
"What is the difference between Java and JavaScript?",
"What is a database?",
"What is SQL?",
"What is the difference between GET and POST?",
"What is an API?",
"What is Spring Boot?",
"What is the difference between HTML and CSS?",
"What is exception handling in Java?"
]

};

let current = 0;
let category = "hr";
let answers = [];

function changeCategory() {

category = document.getElementById("type").value;
current = 0;
answers = [];

document.getElementById("feedback").innerText = "";
document.getElementById("completed").innerText = "";

loadQuestion();

}

function loadQuestion() {

let list = questions[category];

if(current >= list.length) {

document.getElementById("question").innerText =
"Interview Practice Completed! 🎉";

document.getElementById("progress").innerText =
"All 10 questions completed.";

document.getElementById("answer").style.display = "none";

document.getElementById("feedback").innerText =
"Thank you for completing your practice!";

document.getElementById("completed").innerText =
"Answers submitted: " + answers.length;

return;

}

document.getElementById("answer").style.display = "block";

document.getElementById("progress").innerText =
"Question " + (current+1) + " of 10";

document.getElementById("question").innerText =
list[current];

document.getElementById("answer").value = "";

document.getElementById("feedback").innerText = "";

}

function submitAnswer() {

let answer = document.getElementById("answer").value.trim();

if(!answer) {
alert("Please write your answer first.");
return;
}

answers[current] = answer;

document.getElementById("feedback").innerText =
"Answer saved! Good effort. Review your answer and improve it with relevant examples.";

}

function nextQuestion() {

if(!answers[current]) {
alert("Please submit your answer first.");
return;
}

current++;

loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
